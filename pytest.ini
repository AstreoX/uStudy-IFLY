[pytest]
# 测试标记定义
markers =
    e2e: 端到端测试（需要真实 API Key）
    integration: 集成测试
    slow: 慢速测试

# 异步模式
asyncio_mode = auto

# 默认选项
addopts = -v --tb=short

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
