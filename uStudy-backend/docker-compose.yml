services:
  # PostgreSQL + pgvector 数据库
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: ustudy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ustudy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存 (用于流式断点续传)
  redis:
    image: redis:7-alpine
    container_name: ustudy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ustudy-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库连接（Docker 内部网络使用服务名 db）
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-123456}@db:5432/ustudy
      # Redis 连接（Docker 内部网络使用服务名 redis）
      REDIS_URL: redis://redis:6379/0
      # 应用配置
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_BRIDGE_URL: ${OPENROUTER_BRIDGE_URL:-}
      # 邮件配置
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtpdm.aliyun.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@ustudy.app}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-uStudy}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      # 支付宝
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_APP_PRIVATE_KEY_PATH: /app/certs/alipay_app_private_key.pem
      ALIPAY_PUBLIC_KEY_PATH: /app/certs/alipay_public_key.pem
      ALIPAY_SIGN_TYPE: ${ALIPAY_SIGN_TYPE:-RSA2}
      ALIPAY_DEBUG: ${ALIPAY_DEBUG:-false}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      # 爬虫增强
      DEEP_CRAWL_ENABLED: ${DEEP_CRAWL_ENABLED:-false}
      JINA_READER_ENABLED: ${JINA_READER_ENABLED:-true}
      JINA_API_KEY: ${JINA_API_KEY:-}
      CRAWL4AI_API_URL: ${CRAWL4AI_API_URL:-}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_ENABLED: ${CRAWL4AI_ENABLED:-false}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      SEARXNG_ENABLED: ${SEARXNG_ENABLED:-false}
      # Whisper API (视频语音转录回退)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Uvicorn 运行参数（4核8G 推荐）
      UVICORN_WORKERS: ${UVICORN_WORKERS:-6}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-600}
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-2048}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-75}
      # 数据库连接池（每个 worker）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-15}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
    volumes:
      - uploads:/app/uploads
      - payment_static:/app/static/payment
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"
    networks:
      - default
      - crawl4ai_net

  # Crawl4AI - Headless browser for JS-rendered page extraction
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: ustudy-crawl4ai
    restart: unless-stopped
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      MAX_CONCURRENT_TASKS: 3
    ports:
      - "127.0.0.1:9222:11235"
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - crawl4ai_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
  payment_static:
    driver: local

networks:
  crawl4ai_net:
    driver: bridge
