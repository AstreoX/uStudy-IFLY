# SearXNG deployment for Tokyo server (8.211.149.4)
# Deploy to: /root/searxng/
services:
  searxng:
    image: searxng/searxng:latest
    container_name: ustudy-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
